name: Deploy Supabase backend

# A push to main is type-checked and tested first; production is deployed only when every check
# passes, and only from main. Docs, Markdown and the gateway (checked by check-gateway.yml and
# deployed by Railway) never redeploy the backend. npm test also checks docs and gateway wording;
# on a push this workflow skips, check-gateway.yml runs the same npm test.
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'gateway/**'
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time. GitHub keeps only the newest waiting run of a group, so a newer
# push to main replaces an older waiting one (it holds the same changes and more), and a run
# started by hand on another branch, which has its own group, can never replace a waiting main
# deploy. Re-running an older run deploys that older commit over newer code: re-run only the
# newest run, or push.
concurrency:
  group: supabase-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Tests (engine, API, migrations and RLS in PGlite)
        run: npm test

      - name: Build the Edge Function and start it in Deno
        run: npm run test:edge-runtime

      - name: Keep the tested bundle
        uses: actions/upload-artifact@v4
        with:
          name: orderly-edge-bundle
          path: supabase/functions/orderly/index.js
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    # Only one deploy reaches production at a time, whatever started it.
    concurrency:
      group: supabase-production
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Only the locked Supabase CLI is needed here; skipping install scripts keeps package
      # scripts out of the job that holds the deploy token.
      - name: Install the Supabase CLI
        run: npm ci --ignore-scripts

      - name: Use the bundle that passed the checks
        uses: actions/download-artifact@v4
        with:
          name: orderly-edge-bundle
          path: supabase/functions/orderly

      - name: Deploy Orderly Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -s supabase/functions/orderly/index.js
          npx supabase functions deploy orderly --project-ref zygsuxgqkeedgcbjhfzx --use-api

      - name: Check the live function answers
        run: |
          body=$(curl -fsS --retry 6 --retry-delay 5 --retry-all-errors https://zygsuxgqkeedgcbjhfzx.supabase.co/functions/v1/orderly/api/health)
          echo "$body"
          echo "$body" | grep -q '"mode":"live"'
