name: Check WhatsApp gateway
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            gateway/package-lock.json
      - run: npm ci
      - run: npm ci --prefix gateway
      - run: npm run build --prefix gateway
      - run: npm test --prefix gateway
      - run: npm test
      - run: npm run build
      - run: npm run test:edge-runtime
      - run: docker build -f gateway/Dockerfile -t orderly-gateway:test .
