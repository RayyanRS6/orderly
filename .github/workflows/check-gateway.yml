name: Check WhatsApp gateway
# Runs on every push to main, with no path filter. The backend deploy (deploy-backend.yml) skips
# pushes that change only docs, Markdown or gateway/, so this is the check that catches a red
# docs or gateway wording test on such a push. With Railway's Wait for CI on, a red run here
# also holds the gateway deploy of that commit back.
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            gateway/package-lock.json
      - run: npm ci
      - run: npm ci --prefix gateway
      - run: npm run build --prefix gateway
      - run: npm test --prefix gateway
      - name: Orderly tests, including the docs and gateway wording checks
        run: npm test
      - run: npm run build
      - run: npm run test:edge-runtime
      - run: docker build -f gateway/Dockerfile -t orderly-gateway:test .
      - name: Exercise the production container without WhatsApp accounts
        run: npm run test:container --prefix gateway
      - name: Validate production Compose and HTTPS configuration without starting services
        working-directory: gateway
        env:
          GATEWAY_HOSTNAME: gateway.example.com
          ACME_EMAIL: ci@example.com
        run: |
          cp .env.example .env
          docker compose -f compose.yaml -f compose.production.yaml config --quiet
          docker run --rm -e GATEWAY_HOSTNAME -e ACME_EMAIL -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.4-alpine caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile --validate > /dev/null
