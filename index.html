<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E0604" />
    <meta
      name="description"
      content="Orderly brings your restaurant's WhatsApp conversations, menu, and orders together."
    />
    <title>Orderly — Conversations to orders</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23FF692C'/%3E%3Cpath d='M17 19h30v23H29l-10 7v-7h-2z' fill='white'/%3E%3Cpath d='m25 30 5 5 10-11' fill='none' stroke='%230E0604' stroke-width='4'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root">
      <!-- Same loader as App.tsx (styles: .loader in src/index.css). -->
      <div
        class="canvas-glow"
        style="
          min-height: 100dvh;
          display: grid;
          place-items: center;
          padding: 24px;
          background-color: #efebe8;
          color: #0e0604;
        "
      >
        <div class="loader" data-state="loading">
          <div class="loader-brand">
            <span class="loader-tile"
              ><svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path
                  d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"
                /></svg
            ></span>
            <span>orderly<b>.</b></span>
          </div>
          <div class="loader-chat" aria-hidden="true">
            <span class="loader-msg loader-them"><i></i><i></i></span>
            <span class="loader-msg loader-us"><i></i></span>
            <span class="loader-last">
              <span class="loader-typing"><i></i><i></i><i></i></span>
              <span class="loader-done"
                ><svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="3"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M20 6 9 17l-5-5" /></svg
                ><i></i
              ></span>
            </span>
          </div>
          <p class="loader-text" role="status">Opening your workspace…</p>
          <span class="loader-bar" aria-hidden="true"><i></i></span>
        </div>
      </div>
    </div>
    <noscript>
      <div
        style="
          min-height: 100dvh;
          display: grid;
          place-items: center;
          background-color: #efebe8;
          font-family: system-ui, sans-serif;
          padding: 1.5rem;
        "
      >
        <div
          style="
            max-width: 28rem;
            background: rgba(255, 255, 255, 0.65);
            padding: 2rem;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px -8px rgba(14, 6, 4, 0.05);
          "
        >
          <h1 style="font-size: 1.25rem; font-weight: bold; margin-bottom: 0.5rem; color: #0e0604">
            JavaScript Required
          </h1>
          <p style="color: #6c625d; font-size: 0.875rem; line-height: 1.5">
            Orderly requires JavaScript to be enabled in your browser to run the workspace.
          </p>
        </div>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
